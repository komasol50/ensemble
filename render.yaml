# Render の設定。鍵はここに書かない（sync: false は作成時に画面で入力する）。
services:
  - type: web
    name: ensemble
    runtime: docker
    dockerfilePath: ./Dockerfile
    # plan は書かない。書かなければ今のプランを保ち、画面で上げた後に同期で戻らない。
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ensemble-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: ensemble-db
    # plan は書かない。無料のDBは作成から30日で期限が切れる。
    region: singapore
    databaseName: ensemble
    user: ensemble
    ipAllowList: [] # 外から直接つながせない
